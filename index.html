<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZenBreath</title>
    <style>
        /* FIXED: Using absolute positioning for the header to prevent it from disappearing */
        :root { --navy: #0f2d37; --teal: #2c5364; --white: #ffffff; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f8fafb; height: 100vh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
        
        #nav { 
            position: fixed; top: env(safe-area-inset-top); left: 0; right: 0;
            display: flex; justify-content: space-around; background: var(--white); 
            border-bottom: 2px solid #ddd; height: 60px; align-items: center; z-index: 9999;
        }
        .tab { font-weight: bold; color: #888; padding: 10px; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--navy); border-bottom-color: var(--navy); }

        .view { flex: 1; margin-top: 70px; padding: 20px; text-align: center; overflow-y: auto; }
        .hidden { display: none !important; }

        .hex { 
            width: 120px; height: 120px; background: #d1e3e8; margin: 20px auto;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
            transition: transform 2s;
        }
        .grow { transform: scale(1.4); background: #b0d4de; }
        
        .btn { background: var(--navy); color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; margin-top: 20px; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        input { width: 70px; padding: 10px; text-align: center; border-radius: 10px; border: 1px solid #ccc; font-weight: bold; }
    </style>
</head>
<body>

<div id="nav">
    <div class="tab active" id="t1" onclick="go('p')">Practice</div>
    <div class="tab" id="t2" onclick="go('s')">Progress</div>
</div>

<div id="p-view" class="view">
    <div class="hex" id="hex">0</div>
    <div id="stat" style="font-weight:bold; color:var(--teal)">Ready</div>
    <div class="row"><span>Rounds</span><input type="number" id="r" value="3"></div>
    <div class="row"><span>Breaths</span><input type="number" id="b" value="30"></div>
    <button class="btn" id="start">Start Session</button>
</div>

<div id="s-view" class="view hidden">
    <h2 id="total-time">0m Total</h2>
    <div id="list"></div>
</div>

<audio id="in" src="https://www.soundjay.com/human/sounds/human-breath-in-1.mp3"></audio>
<audio id="out" src="https://www.soundjay.com/human/sounds/human-breath-out-1.mp3"></audio>
<audio id="sea" loop src="https://www.soundjay.com/nature/sounds/ocean-wave-1.mp3"></audio>

<script>
    let d = JSON.parse(localStorage.getItem('v22')) || { h: [], t: 0 };
    let active = false, hold = false, startT, count = 0, round = 1;
    const s = [document.getElementById('in'), document.getElementById('out'), document.getElementById('sea')];

    function go(v) {
        document.getElementById('p-view').className = v === 'p' ? 'view' : 'view hidden';
        document.getElementById('s-view').className = v === 's' ? 'view' : 'view hidden';
        document.getElementById('t1').className = v === 'p' ? 'tab active' : 'tab';
        document.getElementById('t2').className = v === 's' ? 'tab active' : 'tab';
        if(v==='s') {
            document.getElementById('total-time').innerText = Math.floor(d.t / 60) + "m Total Hold";
            document.getElementById('list').innerHTML = d.h.slice(0,5).map(x=>`<p>${x.d}: ${x.s}s</p>`).join('');
        }
    }

    document.getElementById('start').onclick = function() {
        s.forEach(x => { x.play(); x.pause(); }); // Unlock Audio
        if(!active) { round = 1; run(); } else if(hold) { end(); }
    };

    function run() {
        active = true; count = 0; s[2].pause();
        document.getElementById('stat').innerText = "Round " + round;
        let itv = setInterval(() => {
            if(!active) { clearInterval(itv); return; }
            count++;
            let grow = count % 2 !== 0;
            document.getElementById('hex').className = grow ? "hex grow" : "hex";
            document.getElementById('hex').innerText = Math.ceil(count/2);
            s[grow?0:1].play();
            if(count >= (document.getElementById('b').value * 2)) { clearInterval(itv); startHold(); }
        }, 2000);
    }

    function startHold() {
        hold = true; startT = Date.now();
        document.getElementById('stat').innerText = "HOLD";
        document.getElementById('start').innerText = "INHALE";
        s[2].play();
        let hItv = setInterval(() => {
            if(!hold) clearInterval(hItv);
            else document.getElementById('hex').innerText = Math.floor((Date.now()-startT)/1000) + "s";
        }, 1000);
    }

    function end() {
        hold = false; s[2].pause();
        let dur = Math.floor((Date.now()-startT)/1000);
        d.t += dur; d.h.unshift({d: new Date().toLocaleDateString(), s: dur});
        localStorage.setItem('v22', JSON.stringify(d));
        
        let rec = 10;
        document.getElementById('stat').innerText = "RECOVERY";
        let rItv = setInterval(() => {
            document.getElementById('hex').innerText = rec;
            rec--;
            if(rec < 0) {
                clearInterval(rItv);
                if(round < document.getElementById('r').value) { round++; run(); }
                else { active = false; document.getElementById('stat').innerText = "Done"; document.getElementById('start').innerText = "Start Session"; }
            }
        }, 1000);
    }
</script>
</body>
</html>
