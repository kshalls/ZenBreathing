<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenBreath Pro</title>
    <style>
        :root { --bg: #f8fafb; --navy: #0f2d37; --accent: #2c5364; --text-dim: #636e72; --white: #ffffff; --border: #d1d8db; --red: #e74c3c; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; color: var(--navy); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header-nav { display: flex; justify-content: space-around; background: var(--white); border-bottom: 1px solid #eee; padding: 10px 0; z-index: 1000; }
        .nav-tab { padding: 10px 20px; font-weight: bold; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; }
        .nav-tab.active { color: var(--navy); border-bottom: 3px solid var(--navy); }
        .content-area { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        .hex-container {
            width: 140px; height: 140px; background: #d1e3e8; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            margin: 20px auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 2.5rem; color: var(--accent); transition: transform 2s ease-in-out;
        }
        .expand { transform: scale(1.4); background: #b0d4de; }
        .recovery-flash { animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0%, 100% { color: var(--accent); } 50% { color: var(--red); } }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .pro-input { background: #ffffff; border: 2px solid var(--border); color: var(--navy); font-weight: bold; font-size: 1.1rem; text-align: center; width: 80px; padding: 10px; border-radius: 12px; outline: none; }
        .btn-action { background: var(--navy); color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; margin-top: 20px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-val { display: block; font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .stat-lab { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }
        .history-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; text-align: left; }
        .del-btn { color: var(--red); border: 1px solid #fee2e2; background: #fff5f5; padding: 5px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="header-nav">
    <div class="nav-tab active" id="tab-p" onclick="switchTab('practice')">Practice</div>
    <div class="nav-tab" id="tab-s" onclick="switchTab('stats')">Progress</div>
</div>

<div id="view-practice" class="content-area">
    <div class="hex-container" id="bubble">0</div>
    <div id="round-info" style="font-weight: bold; color: var(--accent);">Tap Start</div>
    <div class="setting-row"><span>Rounds</span><input type="number" id="in-rounds" class="pro-input" value="3" inputmode="numeric"></div>
    <div class="setting-row"><span>Breaths</span><input type="number" id="in-breaths" class="pro-input" value="30" inputmode="numeric"></div>
    <h4 id="status-display" style="color:var(--text-dim); margin:20px 0;">Audio will unlock on Start</h4>
    <button class="btn-action" id="mainBtn">Start Session</button>
</div>

<div id="view-stats" class="content-area hidden">
    <div class="stat-grid">
        <div class="stat-card"><span class="stat-val" id="val-total">0</span><span class="stat-lab">Total Hold (m)</span></div>
        <div class="stat-card"><span class="stat-val" id="val-best">0s</span><span class="stat-lab">Personal Best</span></div>
        <div class="stat-card"><span class="stat-val" id="val-streak">0</span><span class="stat-lab">Daily Streak</span></div>
        <div class="stat-card"><span class="stat-val" id="val-weekly">0/7</span><span class="stat-lab">Weekly Goal</span></div>
    </div>
    <div id="history-box"></div>
</div>

<audio id="snd-inhale" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-human-breathing-inhale-2311.mp3"></audio>
<audio id="snd-exhale" preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-human-breathing-exhale-2312.mp3"></audio>
<audio id="snd-ocean" loop preload="auto" src="https://assets.mixkit.co/sfx/preview/mixkit-sea-waves-loop-1196.mp3"></audio>
<audio id="snd-chime" preload="auto" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="snd-gong" preload="auto" src="https://actions.google.com/sounds/v1/percussion/gong.ogg"></audio>

<script>
    let db = JSON.parse(localStorage.getItem('zen_v14')) || { history: [], best: 0, totalHold: 0, streak: 0, lastDate: null, weeklyLogs: [] };
    let breathCount = 0; let curRound = 1; let speed = 2000;
    let isActive = false; let isHolding = false; let holdStart;

    const mainBtn = document.getElementById('mainBtn');
    const bubble = document.getElementById('bubble');
    const inhaleSnd = document.getElementById('snd-inhale');
    const exhaleSnd = document.getElementById('snd-exhale');
    const oceanSnd = document.getElementById('snd-ocean');
    const chimeSnd = document.getElementById('snd-chime');
    const gongSnd = document.getElementById('snd-gong');

    function switchTab(t) {
        document.getElementById('view-practice').classList.toggle('hidden', t !== 'practice');
        document.getElementById('view-stats').classList.toggle('hidden', t !== 'stats');
        document.getElementById('tab-p').classList.toggle('active', t === 'practice');
        document.getElementById('tab-s').classList.toggle('active', t === 'stats');
        if(t === 'stats') renderStats();
    }

    mainBtn.onclick = () => {
        // FORCE UNLOCK ALL AUDIO ON CLICK
        const allSounds = [inhaleSnd, exhaleSnd, oceanSnd, chimeSnd, gongSnd];
        allSounds.forEach(s => {
            s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(e => console.log("Unlock error", e));
        });

        if (!isActive) { curRound = 1; runBreathing(); }
        else if (isHolding) stopHold();
    };

    function runBreathing() {
        const maxR = parseInt(document.getElementById('in-rounds').value) || 3;
        const maxB = parseInt(document.getElementById('in-breaths').value) || 30;
        isActive = true; breathCount = 0; oceanSnd.pause();
        document.getElementById('round-info').innerText = `ROUND ${curRound} OF ${maxR}`;
        
        let timer = setInterval(() => {
            if (!isActive) { clearInterval(timer); return; }
            breathCount++;
            const isExpanding = breathCount % 2 !== 0;
            bubble.classList.toggle('expand', isExpanding);
            bubble.innerText = Math.ceil(breathCount/2);

            if (isExpanding) { inhaleSnd.play(); } 
            else { exhaleSnd.play(); }

            if (breathCount >= (maxB * 2)) { clearInterval(timer); runHold(); }
        }, speed);
    }

    function runHold() {
        chimeSnd.play();
        setTimeout(() => { if(isHolding) oceanSnd.play(); }, 500);
        isHolding = true; holdStart = Date.now();
        document.getElementById('status-display').innerText = "HOLDING";
        mainBtn.innerText = "TAP TO INHALE";
        let hTimer = setInterval(() => {
            if (!isHolding) clearInterval(hTimer);
            else bubble.innerText = Math.floor((Date.now() - holdStart)/1000) + 's';
        }, 1000);
    }

    function stopHold() {
        isHolding = false; oceanSnd.pause();
        let holdDuration = Math.floor((Date.now() - holdStart)/1000);
        saveData(holdDuration);
        
        let recoveryLeft = 10;
        bubble.classList.add('recovery-flash');
        document.getElementById('status-display').innerText = "RECOVERY";
        
        let recTimer = setInterval(() => {
            bubble.innerText = recoveryLeft;
            recoveryLeft--;
            if (recoveryLeft < 0) {
                clearInterval(recTimer);
                const maxR = parseInt(document.getElementById('in-rounds').value) || 3;
                if (curRound < maxR) { curRound++; runBreathing(); }
                else { isActive = false; gongSnd.play(); document.getElementById('status-display').innerText = "Complete"; bubble.classList.remove('recovery-flash'); bubble.innerText = "Done"; }
            }
        }, 1000);
    }

    function saveData(h) {
        const today = new Date().toLocaleDateString();
        if (db.lastDate !== today) {
            const yesterday = new Date(Date.now() - 86400000).toLocaleDateString();
            db.streak = (db.lastDate === yesterday) ? db.streak + 1 : 1;
            db.lastDate = today;
            if (!db.weeklyLogs.includes(today)) db.weeklyLogs.push(today);
        }
        db.totalHold += h;
        if (h > db.best) db.best = h;
        db.history.unshift({ id: Date.now(), date: today, hold: h });
        localStorage.setItem('zen_v14', JSON.stringify(db));
    }

    function deleteItem(id) {
        db.history = db.history.filter(i => i.id !== id);
        localStorage.setItem('zen_v14', JSON.stringify(db));
        renderStats();
    }

    function renderStats() {
        document.getElementById('val-total').innerText = Math.floor(db.totalHold / 60);
        document.getElementById('val-best').innerText = db.best + 's';
        document.getElementById('val-streak').innerText = db.streak;
        document.getElementById('val-weekly').innerText = `${db.weeklyLogs.length}/7`;
        const hBox = document.getElementById('history-box');
        hBox.innerHTML = db.history.slice(0, 15).map(i => `<div class="history-card"><div><span>${i.date}</span><br><strong>${i.hold}s Hold</strong></div><button class="del-btn" onclick="deleteItem(${i.id})">Delete</button></div>`).join('');
    }
</script>
</body>
</html>
