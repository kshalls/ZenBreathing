<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenBreath Pro</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3064/3064339.png">
    <style>
        :root {
            --bg: #f8fafb;
            --navy: #0f2d37;
            --accent: #2c5364;
            --text-dim: #636e72;
            --white: #ffffff;
        }

        body {
            background: var(--bg);
            font-family: -apple-system, sans-serif;
            margin: 0; color: var(--navy);
            display: flex; flex-direction: column; height: 100vh;
        }

        .nav-bar {
            display: flex; justify-content: space-around;
            padding: 15px 0; background: var(--white);
            border-bottom: 1px solid #eee;
        }
        .nav-item { font-size: 0.9rem; font-weight: bold; color: var(--text-dim); cursor: pointer; }
        .nav-item.active { color: var(--navy); border-bottom: 2px solid var(--navy); }

        .container { flex: 1; padding: 20px; overflow-y: auto; text-align: center; }

        .hex-container {
            width: 120px; height: 120px; background: #d1e3e8;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            margin: 20px auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 2.5rem; color: var(--accent); transition: transform 2s ease-in-out;
        }
        .expand { transform: scale(1.3); background: #b0d4de; }

        .toggle-group {
            display: flex; background: #eef2f3; border-radius: 12px;
            padding: 5px; margin: 20px 0;
        }
        .toggle-btn {
            flex: 1; padding: 10px; border-radius: 10px; border: none;
            background: transparent; color: var(--text-dim); font-weight: bold;
        }
        .toggle-btn.active { background: var(--navy); color: white; }

        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #eee;
        }
        .pro-input {
            background: transparent; border: none; color: var(--accent);
            font-weight: bold; font-size: 1.1rem; text-align: right; width: 80px; outline: none;
        }

        .start-btn {
            background: var(--navy); color: white; border: none;
            width: 100%; padding: 18px; border-radius: 15px;
            font-size: 1.1rem; font-weight: bold; margin-top: 30px;
        }

        .history-card {
            background: white; padding: 15px; border-radius: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-item active" onclick="showTab('practice')">Practice</div>
    <div class="nav-item" onclick="showTab('stats')">History</div>
</div>

<div id="practice-tab" class="container">
    <div class="hex-container" id="bubble">0</div>
    <div id="round-counter" style="font-size: 0.8rem; color: var(--text-dim);">Ready</div>

    <div class="toggle-group">
        <button class="toggle-btn" onclick="setSpeed(3000, this)">Slow</button>
        <button class="toggle-btn active" onclick="setSpeed(2000, this)">Standard</button>
        <button class="toggle-btn" onclick="setSpeed(1200, this)">Fast</button>
    </div>

    <div class="setting-row">
        <span>Rounds</span>
        <input type="number" id="round-input" class="pro-input" value="3">
    </div>
    <div class="setting-row">
        <span>Breaths per round</span>
        <input type="number" id="breath-input" class="pro-input" value="30">
    </div>

    <h4 id="status-text" style="color:var(--text-dim); margin:20px 0;">Start Session</h4>
    <button class="start-btn" id="mainBtn">Start</button>
</div>

<div id="stats-tab" class="container hidden">
    <h3>Session History</h3>
    <div id="history-list"></div>
</div>

<audio id="gong" src="https://actions.google.com/sounds/v1/percussion/gong.ogg"></audio>

<script>
    let stats = JSON.parse(localStorage.getItem('whProFinal')) || { history: [] };
    let breathCount = 0;
    let currentRound = 1;
    let speed = 2000;
    let isActive = false;
    let holdActive = false;
    let holdStart;

    function showTab(tab) {
        document.getElementById('practice-tab').classList.toggle('hidden', tab !== 'practice');
        document.getElementById('stats-tab').classList.toggle('hidden', tab !== 'stats');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.innerText.toLowerCase() === tab));
        if(tab === 'stats') renderHistory();
    }

    function setSpeed(ms, btn) {
        speed = ms;
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    const mainBtn = document.getElementById('mainBtn');
    mainBtn.onclick = () => {
        if (!isActive) startSession();
        else if (holdActive) endHold();
    };

    function startSession() {
        const totalRounds = parseInt(document.getElementById('round-input').value);
        isActive = true;
        breathCount = 0;
        document.getElementById('round-counter').innerText = `Round ${currentRound} of ${totalRounds}`;
        document.getElementById('status-text').innerText = "Inhale... Exhale...";
        
        let cycle = setInterval(() => {
            if (!isActive) { clearInterval(cycle); return; }
            breathCount++;
            document.getElementById('bubble').classList.toggle('expand');
            document.getElementById('bubble').innerText = Math.ceil(breathCount/2);
            
            const breathsGoal = parseInt(document.getElementById('breath-input').value);
            if (breathCount >= (breathsGoal * 2)) { 
                clearInterval(cycle);
                startHold();
            }
        }, speed);
    }

    function startHold() {
        document.getElementById('gong').play();
        holdActive = true;
        holdStart = Date.now();
        document.getElementById('status-text').innerText = "HOLD BREATH";
        mainBtn.innerText = "Inhaling Now";
        
        let timer = setInterval(() => {
            if (!holdActive) clearInterval(timer);
            else document.getElementById('bubble').innerText = Math.floor((Date.now() - holdStart)/1000) + 's';
        }, 1000);
    }

    function endHold() {
        holdActive = false;
        let holdTime = Math.floor((Date.now() - holdStart)/1000);
        stats.history.unshift({ date: new Date().toLocaleDateString(), hold: holdTime });
        localStorage.setItem('whProFinal', JSON.stringify(stats));
        
        document.getElementById('gong').play();
        document.getElementById('status-text').innerText = "RECOVERY (15s)";
        
        setTimeout(() => {
            const totalRounds = parseInt(document.getElementById('round-input').value);
            if (currentRound < totalRounds) {
                currentRound++;
                startSession();
            } else {
                isActive = false;
                currentRound = 1;
                mainBtn.innerText = "Start";
                document.getElementById('status-text').innerText = "Session Complete!";
                document.getElementById('bubble').innerText = "0";
            }
        }, 15000);
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = stats.history.length ? '' : '<p>No history yet.</p>';
        stats.history.slice(0, 15).forEach(item => {
            list.innerHTML += `<div class="history-card"><span>${item.date}</span><strong>${item.hold}s</strong></div>`;
        });
    }
</script>
</body>
</html>
