<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZenBreath Pro</title>
    <style>
        :root { --bg: #f8fafb; --navy: #0f2d37; --accent: #2c5364; --white: #ffffff; --border: #d1d8db; }
        
        /* Force spacing for iPhone Notch and Chrome address bar */
        body { 
            background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; 
            color: var(--navy); height: 100vh; display: flex; flex-direction: column; 
            padding-top: env(safe-area-inset-top);
        }

        /* FIXED HEADER: Ensuring it is ALWAYS on top */
        .app-header { 
            display: flex; justify-content: space-around; background: var(--white); 
            border-bottom: 2px solid #eee; padding: 15px 0; z-index: 99999; 
            position: relative; 
        }
        .nav-link { padding: 10px 25px; font-weight: bold; color: #636e72; cursor: pointer; font-size: 1rem; }
        .nav-link.active { color: var(--navy); border-bottom: 3px solid var(--navy); }

        .main-viewport { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
        .hidden { display: none !important; }

        .hex-display {
            width: 140px; height: 140px; background: #d1e3e8; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            margin: 30px auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 2.5rem; color: var(--accent); transition: transform 2s ease-in-out;
        }
        .expand { transform: scale(1.4); background: #b0d4de; }

        .config-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .num-input { background: #ffffff; border: 2px solid var(--border); color: var(--navy); font-weight: bold; font-size: 1.1rem; text-align: center; width: 85px; padding: 12px; border-radius: 12px; outline: none; }

        .action-button { background: var(--navy); color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; margin-top: 25px; }

        .stat-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .stat-label { font-size: 0.7rem; color: #636e72; text-transform: uppercase; display: block; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<div class="app-header">
    <div class="nav-link active" id="btn-p" onclick="gotoTab('practice')">Practice</div>
    <div class="nav-link" id="btn-s" onclick="gotoTab('stats')">Progress</div>
</div>

<div id="tab-practice" class="main-viewport">
    <div class="hex-display" id="bubble">0</div>
    <div id="session-info" style="font-weight: bold; color: var(--accent); margin-bottom: 10px;">Ready</div>
    
    <div class="config-row"><span>Rounds</span><input type="number" id="rounds-val" class="num-input" value="3" inputmode="numeric"></div>
    <div class="config-row"><span>Breaths</span><input type="number" id="breaths-val" class="num-input" value="30" inputmode="numeric"></div>
    
    <button class="action-button" id="startBtn">Start Session</button>
</div>

<div id="tab-stats" class="main-viewport hidden">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="stat-box"><span class="stat-value" id="tot-hold">0</span><span class="stat-label">Total Minutes</span></div>
        <div class="stat-box"><span class="stat-value" id="best-hold">0s</span><span class="stat-label">Best Hold</span></div>
    </div>
    <div id="history-container"></div>
</div>

<audio id="audio-in" preload="auto" src="https://www.soundjay.com/human/sounds/human-breath-in-1.mp3"></audio>
<audio id="audio-out" preload="auto" src="https://www.soundjay.com/human/sounds/human-breath-out-1.mp3"></audio>
<audio id="audio-ocean" loop preload="auto" src="https://www.soundjay.com/nature/sounds/ocean-wave-1.mp3"></audio>
<audio id="audio-chime" preload="auto" src="https://www.soundjay.com/button/sounds/button-3.mp3"></audio>
<audio id="audio-gong" preload="auto" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

<script>
    let zenDB = JSON.parse(localStorage.getItem('zen_v20_final')) || { history: [], totalSecs: 0, pb: 0 };
    let bCount = 0, cRound = 1, isActive = false, isHolding = false, hStart;
    
    const snds = ["audio-in", "audio-out", "audio-ocean", "audio-chime", "audio-gong"].map(id => document.getElementById(id));

    function gotoTab(t) {
        document.getElementById('tab-practice').classList.toggle('hidden', t !== 'practice');
        document.getElementById('tab-stats').classList.toggle('hidden', t !== 'stats');
        document.getElementById('btn-p').classList.toggle('active', t === 'practice');
        document.getElementById('btn-s').classList.toggle('active', t === 'stats');
        if(t === 'stats') showStats();
    }

    document.getElementById('startBtn').onclick = function() {
        // iOS Chrome Audio Policy: Must play/pause all on user click
        snds.forEach(s => { s.play(); s.pause(); s.currentTime = 0; });
        
        if (!isActive) { cRound = 1; beginSession(); }
        else if (isHolding) finishHold();
    };

    function beginSession() {
        const rGoal = parseInt(document.getElementById('rounds-val').value) || 3;
        const bGoal = parseInt(document.getElementById('breaths-val').value) || 30;
        isActive = true; bCount = 0; snds[2].pause();
        document.getElementById('session-info').innerText = `Round ${cRound} of ${rGoal}`;
        
        let cycle = setInterval(() => {
            if (!isActive) { clearInterval(cycle); return; }
            bCount++;
            const up = bCount % 2 !== 0;
            document.getElementById('bubble').classList.toggle('expand', up);
            document.getElementById('bubble').innerText = Math.ceil(bCount/2);

            if (up) { snds[0].currentTime = 0; snds[0].play(); } 
            else { snds[1].currentTime = 0; snds[1].play(); }

            if (bCount >= (bGoal * 2)) { clearInterval(cycle); beginHold(); }
        }, 2000);
    }

    function beginHold() {
        snds[3].play();
        setTimeout(() => { if(isHolding) snds[2].play(); }, 500);
        isHolding = true; hStart = Date.now();
        document.getElementById('session-info').innerText = "HOLD";
        document.getElementById('startBtn').innerText = "TAP TO INHALE";
        let hT = setInterval(() => {
            if (!isHolding) clearInterval(hT);
            else document.getElementById('bubble').innerText = Math.floor((Date.now() - hStart)/1000) + 's';
        }, 1000);
    }

    function finishHold() {
        isHolding = false; snds[2].pause();
        let hLen = Math.floor((Date.now() - hStart)/1000);
        
        // Save Totals
        zenDB.totalSecs += hLen;
        if (hLen > zenDB.pb) zenDB.pb = hLen;
        zenDB.history.unshift({ date: new Date().toLocaleDateString(), hold: hLen });
        localStorage.setItem('zen_v20_final', JSON.stringify(zenDB));

        let rec = 10;
        document.getElementById('session-info').innerText = "RECOVERY";
        let rT = setInterval(() => {
            document.getElementById('bubble').innerText = rec;
            rec--;
            if (rec < 0) {
                clearInterval(rT);
                const rGoal = parseInt(document.getElementById('rounds-val').value) || 3;
                if (cRound < rGoal) { cRound++; beginSession(); }
                else { 
                    isActive = false; snds[4].play(); 
                    document.getElementById('session-info').innerText = "Done"; 
                    document.getElementById('startBtn').innerText = "Start Session"; 
                }
            }
        }, 1000);
    }

    function showStats() {
        document.getElementById('tot-hold').innerText = Math.floor(zenDB.totalSecs / 60);
        document.getElementById('best-hold').innerText = zenDB.pb + 's';
        document.getElementById('history-container').innerHTML = zenDB.history.slice(0, 10).map(i => `<div style="background:white; padding:15px; margin:10px 0; border-radius:12px; display:flex; justify-content:space-between"><span>${i.date}</span><strong>${i.hold}s</strong></div>`).join('');
    }
</script>
</body>
</html>
