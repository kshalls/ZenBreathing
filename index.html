<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZenBreath Pro</title>
    <style>
        :root { 
            --bg: #f8fafb; --navy: #0f2d37; --accent: #2c5364; 
            --text: #0f2d37; --white: #ffffff; --border: #d1d8db; --red: #e74c3c; 
        }
        
        body.dark-theme { 
            --bg: #050f13; --navy: #1a3c4a; --accent: #4a90a4; 
            --text: #e0e0e0; --white: #0f2d37; --border: #1a3c4a; 
        }

        body { 
            background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; 
            color: var(--text); min-height: 100vh; display: flex; flex-direction: column; 
            transition: background 0.3s ease; padding-top: env(safe-area-inset-top);
        }

        .header-nav { 
            position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-around; 
            background: var(--white); border-bottom: 1px solid var(--border); 
            padding: env(safe-area-inset-top) 0 15px; z-index: 1000; 
        }
        .nav-tab { padding: 10px 20px; font-weight: bold; color: var(--text); opacity: 0.6; cursor: pointer; font-size: 0.9rem; }
        .nav-tab.active { opacity: 1; border-bottom: 3px solid var(--accent); }

        .viewport { flex: 1; padding: 20px; text-align: center; display: flex; flex-direction: column; overflow-y: auto; }
        .hidden { display: none !important; }

        .session-active .hide-on-start, .session-active .header-nav { display: none !important; }
        .session-active .viewport { justify-content: center; padding: 0; }
        .session-active .hex-container { width: 220px; height: 220px; font-size: 3.5rem; }

        .hex-container {
            width: 140px; height: 140px; background: #d1e3e8; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            margin: 60px auto 40px; display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; color: var(--accent); transition: transform 2s ease-in-out, width 0.5s, height 0.5s;
        }
        .expand { transform: scale(1.4); background: #b0d4de; }
        .shrink { transform: scale(0.15); background: #d1e3e8; }

        .toggle-group { display: flex; background: #eef2f3; border-radius: 12px; padding: 5px; margin: 15px 0; }
        .toggle-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; background: transparent; color: var(--text); font-weight: bold; font-size: 0.8rem; opacity: 0.6; }
        .toggle-btn.active { background: var(--navy); color: white; opacity: 1; }

        .rec-container { width: 80%; height: 12px; background: #eee; border-radius: 6px; margin: 20px auto; overflow: hidden; display: none; border: 1px solid var(--border); }
        .rec-bar { height: 100%; background: #2ecc71; width: 0%; transition: width 1s linear; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--border); }
        .pro-input { background: white; border: 2px solid var(--border); color: var(--navy); font-weight: bold; font-size: 1.1rem; text-align: center; width: 80px; padding: 10px; border-radius: 12px; outline: none; }

        .btn-action { background: var(--navy); color: white; border: none; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; margin: 20px auto; }

        .breathing-card { background: var(--white); padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; border: 1px solid var(--border); }
        .ret-bar { height: 35px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: white; font-weight: bold; margin-bottom: 15px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--white); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .stat-val { display: block; font-size: 1.4rem; font-weight: bold; color: var(--accent); }
        .stat-lab { font-size: 0.65rem; color: var(--text); text-transform: uppercase; display: block; margin-top: 4px; opacity: 0.7; }
        
        .history-card { background: var(--white); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; border: 1px solid var(--border); text-align: left; }
        .session-stats-mini { font-size: 0.75rem; color: var(--accent); margin-top: 4px; display: block; opacity: 0.8; }
        .del-btn { color: var(--red); border: 1px solid #fee2e2; background: #fff5f5; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; margin-top: 5px; }
        
        .theme-toggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 25px; background: var(--navy); color: white; border: none; font-size: 1.5rem; z-index: 10001; }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">🌓</button>

<div class="header-nav">
    <div class="nav-tab active" id="nav-p" onclick="showTab('practice')">Practice</div>
    <div class="nav-tab" id="nav-s" onclick="showTab('stats')">Progress</div>
</div>

<div id="view-practice" class="viewport">
    <div id="session-box">
        <div class="hex-container" id="bubble">0</div>
        <div id="round-info" style="font-weight: bold; color: var(--accent); font-size: 1.2rem;">Ready</div>
        <div class="rec-container" id="rec-container"><div class="rec-bar" id="rec-bar"></div></div>
    </div>

    <div class="hide-on-start">
        <div class="toggle-group">
            <button class="toggle-btn" onclick="setSpeed(3000, 2, this)">Slow</button>
            <button class="toggle-btn active" onclick="setSpeed(2000, 2, this)">Standard</button>
            <button class="toggle-btn" onclick="setSpeed(1200, 1.2, this)">Fast</button>
        </div>
        <div class="setting-row"><span>Total Rounds</span><input type="number" id="in-rounds" class="pro-input" value="3"></div>
        <div class="setting-row"><span>Breaths per Round</span><input type="number" id="in-breaths" class="pro-input" value="30"></div>
    </div>

    <button class="btn-action" id="mainBtn">Start Session</button>
</div>

<div id="view-stats" class="viewport hidden">
    <div class="breathing-card">
        <h3 style="margin: 0 0 15px 0;">Breathing Basics</h3>
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; opacity: 0.7; margin-bottom: 5px;"><span>Longest Retention</span><span>Average Retention</span></div>
        <div class="ret-bar" id="ret-bar"><span id="longest-val">0:00</span><span id="avg-val">0:00</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; text-align: center;">
            <div>Sessions<br><strong id="sess-val">0</strong></div>
            <div>Rounds<br><strong id="round-val">0</strong></div>
            <div>Total<br><strong id="total-val">0h 0m</strong></div>
        </div>
    </div>
    
    <div class="stat-grid">
        <div class="stat-card"><span class="stat-val" id="val-daily">0</span><span class="stat-lab">Daily Streak</span></div>
        <div class="stat-card"><span class="stat-val" id="val-weekly">0</span><span class="stat-lab">Weekly Streak</span></div>
    </div>
    
    <div id="history-box"></div>
</div>

<audio id="snd-inhale" preload="auto" src="https://gfxsounds.com/wp-content/uploads/2023/12/Male-vocalization-surprised-sigh-gasp-and-inhale.mp3"></audio>
<audio id="snd-exhale" preload="auto" src="https://orangefreesounds.com/wp-content/uploads/2025/04/Sigh-sound-effect.mp3"></audio>
<audio id="snd-ocean" loop preload="auto" src="https://gfxsounds.com/wp-content/uploads/2023/05/Beach-ambience-ocean-waves-summer-family.mp3"></audio>
<audio id="snd-chime" preload="auto" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="snd-gong" preload="auto" src="https://gfxsounds.com/wp-content/uploads/2022/07/Chinese-gong-hit.mp3"></audio>

<script>
    let db = JSON.parse(localStorage.getItem('zen_v35')) || { 
        history: [], totalHold: 0, baselineBest: 152, baselineTotalHold: 14280, 
        baselineSessions: 100, baselineRounds: 156, best: 0 
    };
    
    let breathCount = 0, curRound = 1, speed = 2000, isActive = false, isHolding = false, holdStart, currentSessionRounds = [];
    const sounds = ["snd-inhale", "snd-exhale", "snd-ocean", "snd-chime", "snd-gong"].map(id => document.getElementById(id));

    function toggleTheme() { document.body.classList.toggle('dark-theme'); }

    function setSpeed(ms, transitionTime, btn) {
        speed = ms;
        document.getElementById('bubble').style.transition = `transform ${transitionTime}s ease-in-out`;
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function showTab(tab) {
        document.getElementById('view-practice').classList.toggle('hidden', tab !== 'practice');
        document.getElementById('view-stats').classList.toggle('hidden', tab !== 'stats');
        document.getElementById('nav-p').classList.toggle('active', tab === 'practice');
        document.getElementById('nav-s').classList.toggle('active', tab === 'stats');
        if(tab === 'stats') renderStats();
    }

    document.getElementById('mainBtn').onclick = () => {
        sounds.forEach(s => { s.play(); s.pause(); s.currentTime = 0; });
        if (!isActive) { isActive = true; currentSessionRounds = []; curRound = 1; document.body.classList.add('session-active'); runBreathing(); }
        else if (isHolding) stopHold();
    };

    function runBreathing() {
        breathCount = 0; sounds[2].pause(); document.getElementById('rec-container').style.display = 'none';
        document.getElementById('round-info').innerText = `Round ${curRound}`;
        let bGoal = parseInt(document.getElementById('in-breaths').value) || 30;
        let timer = setInterval(() => {
            if (!isActive) { clearInterval(timer); return; }
            breathCount++;
            const up = breathCount % 2 !== 0;
            const bubble = document.getElementById('bubble');
            bubble.classList.toggle('expand', up);
            bubble.classList.toggle('shrink', !up);
            bubble.innerText = Math.ceil(breathCount/2);
            sounds[up ? 0 : 1].play();
            if (breathCount >= (bGoal * 2)) { clearInterval(timer); runHold(); }
        }, speed);
    }

    function runHold() {
        sounds[3].play(); setTimeout(() => { if(isHolding) sounds[2].play(); }, 500);
        isHolding = true; holdStart = Date.now();
        document.getElementById('round-info').innerText = "HOLD";
        document.getElementById('mainBtn').innerText = "TAP TO INHALE";
        const bubble = document.getElementById('bubble');
        bubble.classList.add('expand');
        bubble.classList.remove('shrink');
        let hT = setInterval(() => {
            if (!isHolding) clearInterval(hT);
            else document.getElementById('bubble').innerText = Math.floor((Date.now() - holdStart)/1000) + 's';
        }, 1000);
    }

    function stopHold() {
        isHolding = false; sounds[2].pause();
        let dur = Math.floor((Date.now() - holdStart)/1000);
        currentSessionRounds.push(dur);
        if (dur > db.best) db.best = dur;
        let rec = 10;
        document.getElementById('round-info').innerText = "RECOVERY";
        document.getElementById('rec-container').style.display = 'block';
        const bubble = document.getElementById('bubble');
        bubble.classList.add('expand');
        bubble.classList.remove('shrink');
        let rT = setInterval(() => {
            document.getElementById('bubble').innerText = rec;
            document.getElementById('rec-bar').style.width = ((10-rec)*10) + '%';
            rec--;
            if (rec < 0) {
                clearInterval(rT);
                if (curRound < parseInt(document.getElementById('in-rounds').value)) { curRound++; runBreathing(); }
                else { endSession(); }
            }
        }, 1000);
    }

    function endSession() {
        isActive = false; sounds[4].play();
        let sessionTotalTime = currentSessionRounds.reduce((a, b) => a + b, 0);
        db.totalHold += sessionTotalTime;
        db.history.unshift({ id: Date.now(), date: new Date().toLocaleDateString(), roundTimes: currentSessionRounds });
        localStorage.setItem('zen_v35', JSON.stringify(db));
        document.body.classList.remove('session-active');
        const bubble = document.getElementById('bubble');
        bubble.classList.remove('expand', 'shrink');
        document.getElementById('round-info').innerText = "Done";
        document.getElementById('mainBtn').innerText = "Start Session";
    }

    function deleteItem(id) {
        const item = db.history.find(i => i.id === id);
        if (item) db.totalHold -= item.roundTimes.reduce((a, b) => a + b, 0);
        db.history = db.history.filter(i => i.id !== id);
        localStorage.setItem('zen_v35', JSON.stringify(db));
        renderStats();
    }

    function formatTime(s) {
        return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
    }

    function getStreaks() {
        if (!db.history.length) return { daily: 0, weekly: 0 };
        let dates = [...new Set(db.history.map(h => h.date))].map(d => new Date(d)).sort((a, b) => a - b);
        
        // Daily streak (consecutive days)
        let daily = 1;
        for (let i = dates.length - 2; i >= 0; i--) {
            let diff = Math.floor((dates[i+1] - dates[i]) / (86400000));
            if (diff === 1) daily++;
            else break;
        }
        
        // Weekly streak (consecutive weeks with at least one session)
        let weekly = 1;
        let lastDate = dates[dates.length - 1];
        let currentWeek = Math.floor(lastDate.getTime() / (7 * 86400000));
        for (let i = dates.length - 2; i >= 0; i--) {
            let week = Math.floor(dates[i].getTime() / (7 * 86400000));
            if (week === currentWeek - 1) {
                weekly++;
                currentWeek = week;
            } else if (week < currentWeek - 1) {
                break;
            }
        }
        
        return { daily, weekly };
    }

    function renderStats() {
        let allRounds = [];
        db.history.forEach(session => allRounds = allRounds.concat(session.roundTimes));
        let tH = db.totalHold + db.baselineTotalHold;
        let bestSec = Math.max(db.baselineBest, db.best, ...allRounds, 0);
        let rds = allRounds.length + db.baselineRounds;
        let sessCount = db.history.length + db.baselineSessions;
        let avgS = rds > 0 ? Math.round(tH / rds) : 0;
        let pct = bestSec > 0 ? (avgS / bestSec) * 100 : 0;
        
        document.getElementById('ret-bar').style.background = `linear-gradient(to right, #2c5364 ${pct}%, #0f2d37 ${pct}%)`;
        document.getElementById('longest-val').innerText = formatTime(bestSec);
        document.getElementById('avg-val').innerText = formatTime(avgS);
        document.getElementById('sess-val').innerText = sessCount; 
        document.getElementById('round-val').innerText = rds; 
        document.getElementById('total-val').innerText = `${Math.floor(tH/3600)}h ${Math.floor((tH%3600)/60)}m`;
        
        let streaks = getStreaks();
        document.getElementById('val-daily').innerText = streaks.daily;
        document.getElementById('val-weekly').innerText = streaks.weekly;
        
        document.getElementById('history-box').innerHTML = db.history.slice(0, 15).map(i => {
            let sSum = i.roundTimes.reduce((a, b) => a + b, 0);
            let sBest = Math.max(...i.roundTimes);
            let sAvg = Math.round(sSum / i.roundTimes.length);
            return `<div class="history-card">
                <div>
                    <span style="font-weight:600;">${i.date}</span><br>
                    <strong style="color:var(--navy); font-size:1rem;">Total: ${formatTime(sSum)}</strong><br>
                    <span class="session-stats-mini">Avg: ${formatTime(sAvg)} | Best: ${formatTime(sBest)}</span>
                    <small style="opacity:0.6;">${i.roundTimes.length} Rounds</small>
                </div>
                <button class="del-btn" onclick="deleteItem(${i.id})">Delete</button>
            </div>`;
        }).join('');
    }

    window.addEventListener('load', () => {
        const headerHeight = document.querySelector('.header-nav').offsetHeight;
        document.querySelectorAll('.viewport').forEach(v => {
            v.style.paddingTop = `${headerHeight + 40}px`;
        });
        renderStats();
    });
</script>
</body>
</html>
