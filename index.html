<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZenBreath Pro</title>
    <style>
        :root { --bg: #f8fafb; --navy: #0f2d37; --accent: #2c5364; --text-dim: #636e72; --white: #ffffff; --border: #d1d8db; --red: #e74c3c; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; color: var(--navy); height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-top: env(safe-area-inset-top); }
        .header-nav { display: flex; justify-content: space-around; background: var(--white); border-bottom: 1px solid #eee; padding: 20px 0 10px 0; z-index: 1000; }
        .nav-tab { padding: 10px 25px; font-weight: bold; color: var(--text-dim); cursor: pointer; font-size: 1rem; }
        .nav-tab.active { color: var(--navy); border-bottom: 3px solid var(--navy); }
        .content-area { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        .hex-container { width: 140px; height: 140px; background: #d1e3e8; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); margin: 30px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--accent); transition: transform 2s ease-in-out; }
        .expand { transform: scale(1.4); background: #b0d4de; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .pro-input { background: #ffffff; border: 2px solid var(--border); color: var(--navy); font-weight: bold; font-size: 1.1rem; text-align: center; width: 80px; padding: 10px; border-radius: 12px; outline: none; }
        .btn-action { background: var(--navy); color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; margin-top: 25px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 18px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-val { display: block; font-size: 1.4rem; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<div class="header-nav">
    <div class="nav-tab active" id="tab-p" onclick="switchTab('practice')">Practice</div>
    <div class="nav-tab" id="tab-s" onclick="switchTab('stats')">Progress</div>
</div>

<div id="view-practice" class="content-area">
    <div class="hex-container" id="bubble">0</div>
    <div id="round-info" style="font-weight: bold; color: var(--accent); margin-bottom: 10px;">Check Silent Switch</div>
    <div class="setting-row"><span>Rounds</span><input type="number" id="in-rounds" class="pro-input" value="3" inputmode="numeric"></div>
    <div class="setting-row"><span>Breaths</span><input type="number" id="in-breaths" class="pro-input" value="30" inputmode="numeric"></div>
    <button class="btn-action" id="mainBtn">Start Session</button>
</div>

<div id="view-stats" class="content-area hidden">
    <div class="stat-grid">
        <div class="stat-card"><span class="stat-val" id="val-total">0</span><span>Total Hold (m)</span></div>
        <div class="stat-card"><span class="stat-val" id="val-best">0s</span><span>Best Hold</span></div>
        <div class="stat-card"><span class="stat-val" id="val-streak">0</span><span>Streak</span></div>
        <div class="stat-card"><span class="stat-val" id="val-weekly">0/7</span><span>Weekly</span></div>
    </div>
    <div id="history-box"></div>
</div>

<audio id="snd-inhale" preload="auto" src="https://www.soundjay.com/human/sounds/human-breath-in-1.mp3"></audio>
<audio id="snd-exhale" preload="auto" src="https://www.soundjay.com/human/sounds/human-breath-out-1.mp3"></audio>
<audio id="snd-ocean" loop preload="auto" src="https://www.soundjay.com/nature/sounds/ocean-wave-1.mp3"></audio>
<audio id="snd-chime" preload="auto" src="https://www.soundjay.com/button/sounds/button-3.mp3"></audio>
<audio id="snd-gong" preload="auto" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

<script>
    let db = JSON.parse(localStorage.getItem('zen_v19')) || { history: [], best: 0, totalHold: 0, streak: 0, lastDate: null, weeklyLogs: [] };
    let breathCount = 0, curRound = 1, speed = 2000, isActive = false, isHolding = false, holdStart;
    
    const sounds = ["snd-inhale", "snd-exhale", "snd-ocean", "snd-chime", "snd-gong"].map(id => document.getElementById(id));

    function switchTab(t) {
        document.getElementById('view-practice').classList.toggle('hidden', t !== 'practice');
        document.getElementById('view-stats').classList.toggle('hidden', t !== 'stats');
        document.getElementById('tab-p').classList.toggle('active', t === 'practice');
        document.getElementById('tab-s').classList.toggle('active', t === 'stats');
        if(t === 'stats') renderStats();
    }

    document.getElementById('mainBtn').onclick = () => {
        // THE "FORCE" COMMAND FOR CHROME/IOS
        sounds.forEach(s => { 
            s.muted = false; 
            s.play().then(() => { s.pause(); s.currentTime = 0; }); 
        });

        if (!isActive) { curRound = 1; runBreathing(); }
        else if (isHolding) stopHold();
    };

    function runBreathing() {
        const maxR = parseInt(document.getElementById('in-rounds').value) || 3;
        const maxB = parseInt(document.getElementById('in-breaths').value) || 30;
        isActive = true; breathCount = 0; sounds[2].pause();
        document.getElementById('round-info').innerText = `ROUND ${curRound} OF ${maxR}`;
        
        let timer = setInterval(() => {
            if (!isActive) { clearInterval(timer); return; }
            breathCount++;
            const expanding = breathCount % 2 !== 0;
            document.getElementById('bubble').classList.toggle('expand', expanding);
            document.getElementById('bubble').innerText = Math.ceil(breathCount/2);

            if (expanding) { sounds[0].currentTime = 0; sounds[0].play(); } 
            else { sounds[1].currentTime = 0; sounds[1].play(); }

            if (breathCount >= (maxB * 2)) { clearInterval(timer); runHold(); }
        }, speed);
    }

    function runHold() {
        sounds[3].play();
        setTimeout(() => { if(isHolding) sounds[2].play(); }, 500);
        isHolding = true; holdStart = Date.now();
        document.getElementById('round-info').innerText = "HOLDING";
        document.getElementById('mainBtn').innerText = "TAP TO INHALE";
        let hTimer = setInterval(() => {
            if (!isHolding) clearInterval(hTimer);
            else document.getElementById('bubble').innerText = Math.floor((Date.now() - holdStart)/1000) + 's';
        }, 1000);
    }

    function stopHold() {
        isHolding = false; sounds[2].pause();
        let holdDuration = Math.floor((Date.now() - holdStart)/1000);
        saveData(holdDuration);
        
        let recoveryLeft = 10;
        document.getElementById('round-info').innerText = "RECOVERY";
        let recTimer = setInterval(() => {
            document.getElementById('bubble').innerText = recoveryLeft;
            recoveryLeft--;
            if (recoveryLeft < 0) {
                clearInterval(recTimer);
                const maxR = parseInt(document.getElementById('in-rounds').value) || 3;
                if (curRound < maxR) { curRound++; runBreathing(); }
                else { isActive = false; sounds[4].play(); document.getElementById('round-info').innerText = "Done"; document.getElementById('mainBtn').innerText = "Start Session"; }
            }
        }, 1000);
    }

    function saveData(h) {
        const today = new Date().toLocaleDateString();
        db.totalHold += h; if (h > db.best) db.best = h;
        db.history.unshift({ id: Date.now(), date: today, hold: h });
        localStorage.setItem('zen_v19', JSON.stringify(db));
    }

    function renderStats() {
        document.getElementById('val-total').innerText = Math.floor(db.totalHold / 60);
        document.getElementById('val-best').innerText = db.best + 's';
        document.getElementById('val-streak').innerText = db.streak;
        document.getElementById('history-box').innerHTML = db.history.slice(0, 10).map(i => `<div style="background:white; padding:15px; margin-bottom:10px; border-radius:12px; display:flex; justify-content:space-between"><span>${i.date}</span><strong>${i.hold}s</strong></div>`).join('');
    }
</script>
</body>
</html>
