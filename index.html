<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZenBreath Pro</title>
    <style>
        :root { --bg: #f8fafb; --navy: #0f2d37; --accent: #2c5364; --text-dim: #636e72; --white: #ffffff; --red: #e74c3c; }
        
        body { 
            background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; 
            color: var(--navy); height: 100vh; display: flex; flex-direction: column; 
            overflow: hidden;
        }

        .header-nav { 
            position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-around; 
            background: var(--white); border-bottom: 1px solid #eee; padding: env(safe-area-inset-top) 0 15px 0; z-index: 10000; 
        }
        .nav-tab { padding: 10px 20px; font-weight: bold; color: var(--text-dim); cursor: pointer; font-size: 0.9rem; }
        .nav-tab.active { color: var(--navy); border-bottom: 3px solid var(--navy); }

        .viewport { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
        .hidden { display: none !important; }

        .hex-container {
            width: 140px; height: 140px; background: #d1e3e8; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            margin: 20px auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 2.2rem; color: var(--accent); transition: transform 2s ease-in-out;
        }
        .expand { transform: scale(1.4); background: #b0d4de; }

        .toggle-group { display: flex; background: #eef2f3; border-radius: 12px; padding: 5px; margin: 15px 0; }
        .toggle-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; background: transparent; color: var(--text-dim); font-weight: bold; font-size: 0.8rem; }
        .toggle-btn.active { background: var(--navy); color: white; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .pro-input { background: #ffffff; border: 2px solid #d1d8db; color: var(--navy); font-weight: bold; font-size: 1.1rem; text-align: center; width: 80px; padding: 10px; border-radius: 12px; outline: none; }

        .btn-action { background: var(--navy); color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; margin-top: 20px; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-val { display: block; font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .stat-lab { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }

        .history-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .del-btn { color: var(--red); border: 1px solid #fee2e2; background: #fff5f5; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="header-nav">
    <div class="nav-tab active" id="nav-p" onclick="showTab('practice')">Practice</div>
    <div class="nav-tab" id="nav-s" onclick="showTab('stats')">Progress</div>
</div>

<div id="view-practice" class="viewport">
    <div class="hex-container" id="bubble">0</div>
    <div id="round-info" style="font-weight: bold; color: var(--accent);">Ready to Start</div>

    <div class="toggle-group">
        <button class="toggle-btn" onclick="setSpeed(3000, 2, this)">Slow</button>
        <button class="toggle-btn active" onclick="setSpeed(2000, 2, this)">Standard</button>
        <button class="toggle-btn" onclick="setSpeed(1200, 1.2, this)">Fast</button>
    </div>

    <div class="setting-row"><span>Total Rounds</span><input type="number" id="in-rounds" class="pro-input" value="3" inputmode="numeric"></div>
    <div class="setting-row"><span>Breaths per Round</span><input type="number" id="in-breaths" class="pro-input" value="30" inputmode="numeric"></div>

    <h4 id="status-text" style="color:var(--text-dim); margin:20px 0; font-weight: 400;">Ensure Silent Switch is OFF</h4>
    <button class="btn-action" id="mainBtn">Start Session</button>
</div>

<div id="view-stats" class="viewport hidden">
    <div class="stat-grid">
        <div class="stat-card"><span class="stat-val" id="val-total">0</span><span class="stat-lab">Total Hold (m)</span></div>
        <div class="stat-card"><span class="stat-val" id="val-best">0s</span><span class="stat-lab">Best Hold</span></div>
        <div class="stat-card"><span class="stat-val" id="val-sessions">0</span><span class="stat-lab">Sessions</span></div>
        <div class="stat-card"><span class="stat-val" id="val-rounds">0</span><span class="stat-lab">Total Rounds</span></div>
        <div class="stat-card"><span class="stat-val" id="val-streak">0</span><span class="stat-lab">Day Streak</span></div>
        <div class="stat-card"><span class="stat-val" id="val-weekly">0/7</span><span class="stat-lab">Weekly Goal</span></div>
    </div>
    <h3 style="text-align: left; font-size: 1rem;">Session History</h3>
    <div id="history-box"></div>
</div>

<audio id="snd-inhale" preload="auto" src="https://gfxsounds.com/wp-content/uploads/2023/12/Male-vocalization-surprised-sigh-gasp-and-inhale.mp3"></audio>
<audio id="snd-exhale" preload="auto" src="https://orangefreesounds.com/wp-content/uploads/2025/04/Sigh-sound-effect.mp3"></audio>
<audio id="snd-ocean" loop preload="auto" src="https://gfxsounds.com/wp-content/uploads/2023/05/Beach-ambience-ocean-waves-summer-family.mp3"></audio>
<audio id="snd-chime" preload="auto" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="snd-gong" preload="auto" src="https://gfxsounds.com/wp-content/uploads/2022/07/Chinese-gong-hit.mp3"></audio>

<script>
    let db = JSON.parse(localStorage.getItem('zen_v23_final')) || { history: [], best: 0, totalHold: 0, streak: 0, lastDate: null, weeklyLogs: [] };
    let breathCount = 0; let curRound = 1; let speed = 2000;
    let isActive = false; let isHolding = false; let holdStart;

    const mainBtn = document.getElementById('mainBtn');
    const bubble = document.getElementById('bubble');
    const sounds = ["snd-inhale", "snd-exhale", "snd-ocean", "snd-chime", "snd-gong"].map(id => document.getElementById(id));

    function showTab(tab) {
        document.getElementById('view-practice').classList.toggle('hidden', tab !== 'practice');
        document.getElementById('view-stats').classList.toggle('hidden', tab !== 'stats');
        document.getElementById('nav-p').classList.toggle('active', tab === 'practice');
        document.getElementById('nav-s').classList.toggle('active', tab === 'stats');
        if(tab === 'stats') renderStats();
    }

    function setSpeed(ms, transitionTime, btn) {
        speed = ms;
        bubble.style.transition = `transform ${transitionTime}s ease-in-out`;
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    mainBtn.onclick = () => {
        sounds.forEach(s => { s.play(); s.pause(); s.currentTime = 0; }); // Unlock Chrome Audio
        if (!isActive) { curRound = 1; runBreathing(); }
        else if (isHolding) stopHold();
    };

    function runBreathing() {
        const maxR = parseInt(document.getElementById('in-rounds').value) || 3;
        const maxB = parseInt(document.getElementById('in-breaths').value) || 30;
        isActive = true; breathCount = 0; sounds[2].pause();
        document.getElementById('round-info').innerText = `ROUND ${curRound} OF ${maxR}`;
        document.getElementById('status-text').innerText = "Inhale... Exhale...";
        
        let timer = setInterval(() => {
            if (!isActive) { clearInterval(timer); return; }
            breathCount++;
            const expanding = breathCount % 2 !== 0;
            bubble.classList.toggle('expand', expanding);
            bubble.innerText = Math.ceil(breathCount/2);

            if (expanding) { sounds[0].currentTime = 0; sounds[0].play().catch(()=>{}); } 
            else { sounds[1].currentTime = 0; sounds[1].play().catch(()=>{}); }

            if (breathCount >= (maxB * 2)) { clearInterval(timer); runHold(); }
        }, speed);
    }

    function runHold() {
        sounds[3].play();
        setTimeout(() => { if(isHolding) sounds[2].play(); }, 500);
        isHolding = true; holdStart = Date.now();
        document.getElementById('round-info').innerText = "HOLDING";
        document.getElementById('status-text').innerText = "Focus on the Waves";
        mainBtn.innerText = "TAP TO INHALE";
        let hTimer = setInterval(() => {
            if (!isHolding) clearInterval(hTimer);
            else bubble.innerText = Math.floor((Date.now() - holdStart)/1000) + 's';
        }, 1000);
    }

    function stopHold() {
        isHolding = false; sounds[2].pause();
        let holdDuration = Math.floor((Date.now() - holdStart)/1000);
        saveData(holdDuration);
        
        let recoveryLeft = 10;
        document.getElementById('round-info').innerText = "RECOVERY";
        document.getElementById('status-text').innerText = "Take a Deep Breath";
        
        let recTimer = setInterval(() => {
            bubble.innerText = recoveryLeft;
            recoveryLeft--;
            if (recoveryLeft < 0) {
                clearInterval(recTimer);
                const maxR = parseInt(document.getElementById('in-rounds').value) || 3;
                if (curRound < maxR) { curRound++; runBreathing(); }
                else { 
                    isActive = false; sounds[4].play(); 
                    document.getElementById('round-info').innerText = "Session Complete"; 
                    document.getElementById('status-text').innerText = "Well Done!";
                    bubble.innerText = "Done"; 
                    mainBtn.innerText = "Start Session";
                }
            }
        }, 1000);
    }

    function saveData(h) {
        const today = new Date().toLocaleDateString();
        if (db.lastDate !== today) {
            const yesterday = new Date(Date.now() - 86400000).toLocaleDateString();
            db.streak = (db.lastDate === yesterday) ? db.streak + 1 : 1;
            db.lastDate = today;
            if (!db.weeklyLogs.includes(today)) db.weeklyLogs.push(today);
            const weekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            db.weeklyLogs = db.weeklyLogs.filter(d => new Date(d) > weekAgo);
        }
        db.totalHold += h;
        if (h > db.best) db.best = h;
        db.history.unshift({ id: Date.now(), date: today, hold: h });
        localStorage.setItem('zen_v23_final', JSON.stringify(db));
    }

    function deleteItem(id) {
        const item = db.history.find(i => i.id === id);
        if (item) db.totalHold -= item.hold;
        db.history = db.history.filter(i => i.id !== id);
        localStorage.setItem('zen_v23_final', JSON.stringify(db));
        renderStats();
    }

    function renderStats() {
        document.getElementById('val-total').innerText = Math.floor(db.totalHold / 60);
        document.getElementById('val-best').innerText = db.best + 's';
        document.getElementById('val-sessions').innerText = [...new Set(db.history.map(i => i.date))].length;
        document.getElementById('val-rounds').innerText = db.history.length;
        document.getElementById('val-streak').innerText = db.streak;
        document.getElementById('val-weekly').innerText = `${db.weeklyLogs.length}/7`;
        document.getElementById('history-box').innerHTML = db.history.slice(0, 15).map(i => `
            <div class="history-card">
                <div><span>${i.date}</span><br><strong>${i.hold}s Hold</strong></div>
                <button class="del-btn" onclick="deleteItem(${i.id})">Delete</button>
            </div>`).join('');
    }

    window.addEventListener('load', () => {
        const headerHeight = document.querySelector('.header-nav').offsetHeight;
        document.querySelectorAll('.viewport').forEach(v => v.style.paddingTop = `${headerHeight + 20}px`);
    });
</script>
</body>
</html>
