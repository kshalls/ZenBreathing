<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZenBreath Pro</title>
    <style>
        :root { 
            --bg: #f8fafb; --navy: #0f2d37; --accent: #2c5364; 
            --text: #0f2d37; --white: #ffffff; --border: #d1d8db;
        }
        /* Dark Mode Theme */
        body.dark-theme {
            --bg: #050f13; --navy: #1a3c4a; --accent: #4a90a4;
            --text: #e0e0e0; --white: #0f2d37; --border: #1a3c4a;
        }
        
        body { 
            background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; 
            color: var(--text); height: 100vh; display: flex; flex-direction: column; 
            overflow: hidden; transition: background 0.3s ease;
        }

        .header-nav { 
            position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-around; 
            background: var(--white); border-bottom: 1px solid var(--border); 
            padding: env(safe-area-inset-top) 0 15px 0; z-index: 10000; 
        }
        .nav-tab { padding: 10px 20px; font-weight: bold; color: var(--text); opacity: 0.6; cursor: pointer; }
        .nav-tab.active { opacity: 1; border-bottom: 3px solid var(--accent); }

        .viewport { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
        .hidden { display: none !important; }

        /* Focus Mode Logic */
        .session-active .hide-on-start { display: none !important; }
        .session-active .header-nav { display: none !important; }

        .hex-container {
            width: 160px; height: 160px; background: #d1e3e8; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            margin: 40px auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 2.5rem; color: #2c5364; transition: transform 2s ease-in-out;
        }
        .expand { transform: scale(1.4); background: #b0d4de; }

        /* Recovery Bar */
        .rec-container { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-top: 20px; overflow: hidden; display: none; }
        .rec-bar { height: 100%; background: #2ecc71; width: 0%; transition: width 1s linear; }

        .btn-action { background: var(--accent); color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; margin-top: 20px; }
        .theme-toggle { position: fixed; bottom: 20px; right: 20px; padding: 10px; border-radius: 50%; background: var(--white); border: 1px solid var(--border); z-index: 10001; }

        /* Stats Card from Grok Code preserved */
        .breathing-card { background: var(--white); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
        .ret-bar { height: 30px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; color: white; font-weight: bold; }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">🌓</button>

<div class="header-nav">
    <div class="nav-tab active" id="nav-p" onclick="showTab('practice')">Practice</div>
    <div class="nav-tab" id="nav-s" onclick="showTab('stats')">Progress</div>
</div>

<div id="view-practice" class="viewport">
    <div id="focus-area">
        <div class="hex-container" id="bubble">0</div>
        <div id="round-info" style="font-weight: bold; font-size: 1.2rem; margin-bottom: 10px;">Ready</div>
        <div class="rec-container" id="rec-container"><div class="rec-bar" id="rec-bar"></div></div>
    </div>

    <div class="hide-on-start">
        <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border);">
            <span>Rounds</span><input type="number" id="in-rounds" value="3" style="width:60px; text-align:center;">
        </div>
        <div style="display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border);">
            <span>Breaths</span><input type="number" id="in-breaths" value="30" style="width:60px; text-align:center;">
        </div>
    </div>

    <button class="btn-action" id="mainBtn">Start Session</button>
</div>

<div id="view-stats" class="viewport hidden">
    <div class="breathing-card">
        <div class="ret-bar" id="ret-bar">
            <span id="longest-val">0:00</span>
            <span id="avg-val">0:00</span>
        </div>
        </div>
    <div id="history-box"></div>
</div>

<audio id="snd-inhale" src="https://www.soundjay.com/human/sounds/human-breath-in-1.mp3"></audio>
<audio id="snd-exhale" src="https://www.soundjay.com/human/sounds/human-breath-out-1.mp3"></audio>
<audio id="snd-ocean" loop src="https://www.soundjay.com/nature/sounds/ocean-wave-1.mp3"></audio>
<audio id="snd-chime" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="snd-gong" src="https://www.soundjay.com/button/sounds/button-10.mp3"></audio>

<script>
    let db = JSON.parse(localStorage.getItem('zen_v25')) || { history: [], best: 0, totalHold: 0, streak: 0, baselineBest: 152, baselineTotalHold: 14280, baselineSessions: 100, baselineRounds: 156 };
    let breathCount = 0, curRound = 1, isActive = false, isHolding = false, holdStart;
    const sounds = ["snd-inhale", "snd-exhale", "snd-ocean", "snd-chime", "snd-gong"].map(id => document.getElementById(id));

    function toggleTheme() { document.body.classList.toggle('dark-theme'); }

    function showTab(tab) {
        document.getElementById('view-practice').classList.toggle('hidden', tab !== 'practice');
        document.getElementById('view-stats').classList.toggle('hidden', tab !== 'stats');
        document.getElementById('nav-p').classList.toggle('active', tab === 'practice');
        document.getElementById('nav-s').classList.toggle('active', tab === 'stats');
    }

    document.getElementById('mainBtn').onclick = () => {
        sounds.forEach(s => { s.play(); s.pause(); s.currentTime = 0; });
        if (!isActive) startSession();
        else if (isHolding) stopHold();
    };

    function startSession() {
        isActive = true; curRound = 1;
        document.body.classList.add('session-active');
        runBreathing();
    }

    function runBreathing() {
        breathCount = 0; sounds[2].pause();
        document.getElementById('round-info').innerText = `Round ${curRound}`;
        document.getElementById('rec-container').style.display = 'none';
        
        let timer = setInterval(() => {
            if (!isActive) { clearInterval(timer); return; }
            breathCount++;
            const expanding = breathCount % 2 !== 0;
            document.getElementById('bubble').classList.toggle('expand', expanding);
            document.getElementById('bubble').innerText = Math.ceil(breathCount/2);
            sounds[expanding ? 0 : 1].play();

            if (breathCount >= (parseInt(document.getElementById('in-breaths').value) * 2)) {
                clearInterval(timer); runHold();
            }
        }, 2000);
    }

    function runHold() {
        sounds[3].play();
        setTimeout(() => { if(isHolding) sounds[2].play(); }, 500);
        isHolding = true; holdStart = Date.now();
        document.getElementById('round-info').innerText = "HOLD";
        document.getElementById('mainBtn').innerText = "TAP TO INHALE";
        let hT = setInterval(() => {
            if (!isHolding) clearInterval(hT);
            else document.getElementById('bubble').innerText = Math.floor((Date.now() - holdStart)/1000) + 's';
        }, 1000);
    }

    function stopHold() {
        isHolding = false; sounds[2].pause();
        let dur = Math.floor((Date.now() - holdStart)/1000);
        db.totalHold += dur; if (dur > db.best) db.best = dur;
        db.history.unshift({ date: new Date().toLocaleDateString(), hold: dur });
        localStorage.setItem('zen_v25', JSON.stringify(db));

        let rec = 10;
        document.getElementById('round-info').innerText = "RECOVERY";
        document.getElementById('rec-container').style.display = 'block';
        let rT = setInterval(() => {
            document.getElementById('bubble').innerText = rec;
            document.getElementById('rec-bar').style.width = ((10-rec)*10) + '%';
            rec--;
            if (rec < 0) {
                clearInterval(rT);
                if (curRound < parseInt(document.getElementById('in-rounds').value)) {
                    curRound++; runBreathing();
                } else {
                    isActive = false; sounds[4].play();
                    document.body.classList.remove('session-active');
                    document.getElementById('round-info').innerText = "Done";
                    document.getElementById('mainBtn').innerText = "Start Session";
                }
            }
        }, 1000);
    }
</script>
</body>
</html>
